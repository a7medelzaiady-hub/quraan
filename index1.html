<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز خادم القرآن الكريم</title>
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #0A2218 0%, #0F2E23 100%);
      --gold-primary: #D4AF37;
      --gold-light: #F3E5AB;
      --text-light: #F8F9FA;
      --card-bg-light: #FFFFFF;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(212, 175, 55, 0.3);
      --border-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-light);
      min-height: 100vh;
      padding-bottom: 90px; /* مساحة للأزرار العائمة في الأسفل */
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* --- الهيدر والشعار --- */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo-badge {
      width: 70px;
      height: 70px;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      background: rgba(212, 175, 55, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
    }

    .logo-badge svg {
      width: 36px;
      height: 36px;
      fill: var(--gold-primary);
    }

    .title {
      color: var(--gold-light);
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 400;
    }

    /* --- أزرار التنقل العلوية (Glassmorphism) --- */
    .top-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .nav-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-light);
      padding: 12px 10px;
      border-radius: var(--border-radius);
      backdrop-filter: blur(8px);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.25s ease;
      text-decoration: none;
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
      stroke: var(--gold-primary);
      fill: none;
    }

    .nav-btn:hover {
      background: rgba(212, 175, 55, 0.15);
      border-color: var(--gold-primary);
      transform: translateY(-2px);
    }

    .nav-btn .sub-text {
      font-size: 0.75rem;
      opacity: 0.7;
      font-weight: 400;
    }

    /* --- كارت نظام الرصد --- */
    .system-card {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--border-radius);
      padding: 16px;
      margin-bottom: 24px;
      text-align: center;
    }

    .system-title {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .toggle-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
    }

    .toggle-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* الحالة النشطة للزر الذهبي */
    .toggle-btn.active {
      background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
      color: #0F2E23;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    /* --- قسم نموذج البيانات (خلفية أبيض كريمي للتباين) --- */
    .form-section {
      background: var(--card-bg-light);
      color: #2D3748;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .form-header {
      background: #0F2E23;
      color: var(--gold-light);
      padding: 14px 20px;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid var(--gold-primary);
    }

    .form-body {
      padding: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: #4A5568;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #E2E8F0;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-color: #0F2E23;
    }

    /* --- الأزرار العائمة في الأسفل (Bottom Bar) --- */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 46, 35, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--glass-border);
      padding: 12px 16px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 12px;
      max-width: 480px;
      margin: 0 auto;
      z-index: 100;
    }

    /* الزر الرئيسي (استخراج التقرير) */
    .btn-primary {
      background: linear-gradient(135deg, #1B4332 0%, #0F2E23 100%);
      border: 1.5px solid var(--gold-primary);
      color: var(--gold-light);
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s;
    }

    /* الزر الثانوي (طالب جديد) */
    .btn-secondary {
      background: #F4F6F8;
      border: 1px solid #CBD5E0;
      color: #2D3748;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-primary:active, .btn-secondary:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- الهيدر -->
    <header class="header">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <h1 class="title">مركز خادم القرآن الكريم</h1>
      <p class="subtitle">تحت إشراف الشيخ عبدالرحمن</p>
    </header>

    <!-- الأزرار العلوية -->
    <div class="top-nav">
      <button class="nav-btn">
        <svg viewBox="0 0 24 24" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        إضافة طالب جديد
      </button>

      <button class="nav-btn">
        <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        إدارة التقارير
        <span class="sub-text">(manage.html)</span>
      </button>
    </div>

    <!-- كارت نظام الرصد والتسجيل -->
    <div class="system-card">
      <div class="system-title">
        ⚙️ نظام رصد وتسجيل الأخطاء الحالي:
      </div>
      <div class="toggle-group">
        <button class="toggle-btn active">
          🎯 برقم الآية / السؤال
        </button>
        <button class="toggle-btn">
          🔢 بالعدد التلقائي (1، 2..)
        </button>
      </div>
    </div>

    <!-- قسم بيانات البطل -->
    <div class="form-section">
      <div class="form-header">
        👤 بيانات البطل التعليمية
      </div>
      <div class="form-body">
        <div class="form-group">
          <label for="studentName">اسم البطل الكريم</label>
          <input type="text" id="studentName" class="form-control" placeholder="أدخل اسم البطل">
        </div>
      </div>
    </div>

  </div>

  <!-- الأزرار الثابتة بالأسفل -->
  <div class="bottom-bar">
    <button class="btn-primary">
      ✨ استخراج وحفظ التقرير
    </button>
    <button class="btn-secondary">
      👤 طالب جديد
    </button>
  </div>

</body>
</html>
