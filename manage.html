<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة الطلاب والحركات والتقارير</title>
  <style>
    /* ألوان مستوحاة بدقة من تصميم EdNova Academy */
    :root {
      --primary-color: #043e35;       /* الأخضر الداكن */
      --secondary-color: #0b5e4c;     /* الأخضر الزيتي المتوسط */
      --accent-gold: #e59829;         /* الذهبي / البرتقالي */
      --accent-gold-hover: #cc831e;
      --danger-color: #ba2d20;
      --danger-hover: #d93829;
      --bg-color: #f3f5f2;            /* الخلفية الفاتحة المريحة */
      --card-bg: #ffffff;
      --text-color: #1a2a26;
      --border-color: #cfdad5;
    }

    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 15px; }
    .container { max-width: 900px; margin: 0 auto; }

    /* Header Styling */
    .header { 
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); 
      color: white; 
      padding: 18px 22px; 
      border-radius: 14px; 
      margin-bottom: 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 10px; 
      flex-wrap: wrap;
      box-shadow: 0 4px 12px rgba(4, 62, 53, 0.15);
    }
    .header h2 { font-size: 20px; font-weight: bold; }
    .header-btns { display: flex; gap: 10px; }
    
    /* أزرار ذهبية وحمراء بتصميم عصري */
    .btn-main { 
      background: var(--accent-gold); 
      color: white; 
      border: none; 
      padding: 9px 18px; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(229, 152, 41, 0.3);
    }
    .btn-main:hover { background: var(--accent-gold-hover); transform: translateY(-1px); }

    .btn-danger-all { 
      background: var(--danger-color); 
      color: white; 
      border: none; 
      padding: 9px 18px; 
      border-radius: 8px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: all 0.2s ease;
    }
    .btn-danger-all:hover { background: var(--danger-hover); }

    /* Card Box */
    .card { 
      background: var(--card-bg); 
      border-radius: 14px; 
      padding: 22px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.04); 
      margin-bottom: 20px; 
      border: 1px solid var(--border-color); 
    }
    .card h3 { color: var(--primary-color); margin-bottom: 12px; border-bottom: 2px solid #e8eeec; padding-bottom: 8px; }

    /* Custom Dropdown Input */
    .autocomplete-container { position: relative; width: 100%; margin-bottom: 5px; }
    .input-label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; color: var(--primary-color); }
    .search-input { 
      width: 100%; 
      padding: 12px 15px; 
      border: 2px solid var(--border-color); 
      border-radius: 10px; 
      font-size: 15px; 
      outline: none; 
      transition: 0.3s; 
    }
    .search-input:focus { border-color: var(--secondary-color); box-shadow: 0 0 0 3px rgba(11, 94, 76, 0.1); }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-top: 5px;
      max-height: 220px;
      overflow-y: auto;
      box-shadow: 0 8px 18px rgba(0,0,0,0.12);
      z-index: 1000;
      display: none;
    }
    .dropdown-item { padding: 12px 15px; border-bottom: 1px solid #f0f4f2; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover { background-color: #eaf2ef; color: var(--primary-color); }

    /* Student List Cards */
    .students-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; margin-top: 15px; }
    
    .student-card { 
      background: white; 
      border: 1px solid var(--border-color); 
      border-radius: 12px; 
      padding: 16px; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      position: relative; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }
    .student-card:hover { transform: translateY(-3px); border-color: var(--secondary-color); box-shadow: 0 6px 14px rgba(4, 62, 53, 0.08); }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .student-name { font-weight: bold; font-size: 16px; color: var(--primary-color); word-break: break-word; }
    
    .btn-delete-single { background: #fceae8; color: var(--danger-color); border: 1px solid #f8cbad; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-delete-single:hover { background: var(--danger-color); color: white; }

    .student-info { font-size: 13px; color: #5a6e67; margin-top: 8px; }

    /* Transactions Table & Details */
    .view-section { display: none; }
    .view-section.active { display: block; }
    .back-btn { background: #5a6e67; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-weight: bold; transition: 0.2s; }
    .back-btn:hover { background: #43534e; }
    
    .btn-whatsapp { 
      background: #25d366; 
      color: white; 
      border: none; 
      padding: 11px 20px; 
      border-radius: 9px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 14px; 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      margin-top: 15px; 
      transition: 0.2s; 
      box-shadow: 0 3px 8px rgba(37, 211, 102, 0.2);
    }
    .btn-whatsapp:hover { background: #1eb854; transform: translateY(-1px); }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { text-align: right; padding: 12px; border-bottom: 1px solid var(--border-color); }
    th { background-color: #eaf2ef; color: var(--primary-color); font-weight: bold; }
    .badge { padding: 4px 9px; border-radius: 6px; font-size: 12px; color: white; font-weight: bold; }
    .badge-pay { background-color: var(--secondary-color); }
    .badge-fee { background-color: var(--accent-gold); }

    .no-data { text-align: center; color: #7f928b; padding: 25px; font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Header -->
  <div class="header">
    <h2 id="page-title">صفحة الطلاب</h2>
    <div class="header-btns">
      <!-- الزر يفتح صفحة index1.html مباشرة -->
      <button class="btn-main" onclick="window.location.href='index1.html'">الرئيسية 🏠</button>
      <button class="btn-danger-all" onclick="deleteAllStudents()">🗑️ مسح الكل</button>
    </div>
  </div>

  <!-- MAIN VIEW: القائمة وحقل البحث المنسدل -->
  <div id="main-view" class="view-section active">
    
    <div class="card">
      <div class="autocomplete-container">
        <label class="input-label">بحث سريع عن طالب بالاسم:</label>
        <input type="text" id="studentSearchInput" class="search-input" placeholder="اكتب اسم الطالب للبحث..." autocomplete="off">
        <div id="customDropdown" class="dropdown-menu"></div>
      </div>
    </div>

    <div class="card">
      <h3>جميع الطلاب المسجلين</h3>
      <div id="studentsGrid" class="students-grid"></div>
    </div>

  </div>

  <!-- STUDENT DETAIL VIEW: ملف الطالب واستعراض التقارير -->
  <div id="student-detail-view" class="view-section">
    <button class="back-btn" onclick="showView('main-view')">← العودة لقائمة الطلاب</button>
    
    <div class="card">
      <h2 id="detailName" style="color: var(--primary-color);">اسم الطالب</h2>
      <p id="detailPhone" style="color: #5a6e67; margin-top: 5px;"></p>
      
      <div style="display: flex; gap: 20px; margin-top: 15px; background: #eaf2ef; padding: 15px; border-radius: 10px; flex-wrap: wrap; border: 1px solid #d4e2dd;">
        <div><strong>إجمالي العمليات:</strong> <span id="detailTotalOps">0</span></div>
        <div><strong>المتبقي / الحساب:</strong> <span id="detailBalance" style="color: var(--danger-color); font-weight: bold;">0 ج.م</span></div>
      </div>

      <!-- زر مشاركة التقرير مع ولي الأمر -->
      <button class="btn-whatsapp" onclick="shareReportWithGuardian()">
        📲 مشاركة التقرير المحفوظ مع ولي الأمر (واتساب)
      </button>
    </div>

    <div class="card">
      <h3>سِجل التقارير والعمليات المحفوظة</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>التاريخ والوقت</th>
              <th>نوع الحركة / التقرير</th>
              <th>البيان والتفاصيل</th>
              <th>المبلغ</th>
            </tr>
          </thead>
          <tbody id="transactionsBody">
            <!-- التقارير تظهر هنا -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script>
  // تم إفراغ المصفوفة بالكامل لتصبح جاهزة لإضافة بياناتك
  let studentsData = [];

  let currentSelectedStudent = null;

  const searchInput = document.getElementById('studentSearchInput');
  const dropdown = document.getElementById('customDropdown');
  const studentsGrid = document.getElementById('studentsGrid');

  // 1. تشغيل قائمة البحث المنسدلة (Auto-complete)
  searchInput.addEventListener('input', function() {
    const query = this.value.trim().toLowerCase();
    dropdown.innerHTML = '';

    if (query === '') {
      dropdown.style.display = 'none';
      return;
    }

    const filtered = studentsData.filter(s => s.name.toLowerCase().includes(query));

    if (filtered.length > 0) {
      filtered.forEach(student => {
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        item.textContent = student.name;
        item.onclick = () => {
          searchInput.value = student.name;
          dropdown.style.display = 'none';
          openStudentProfile(student.id);
        };
        dropdown.appendChild(item);
      });
      dropdown.style.display = 'block';
    } else {
      dropdown.style.display = 'none';
    }
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.autocomplete-container')) {
      dropdown.style.display = 'none';
    }
  });

  // 2. عرض كروت الطلاب مع زر المسح الخاص بكل طالب
  function renderStudentsList() {
    studentsGrid.innerHTML = '';

    if (studentsData.length === 0) {
      studentsGrid.innerHTML = '<div class="no-data" style="grid-column: 1/-1;">لا يوجد طلاب مسجلون حاليًا.</div>';
      return;
    }

    studentsData.forEach(student => {
      const card = document.createElement('div');
      card.className = 'student-card';
      card.onclick = () => openStudentProfile(student.id);

      card.innerHTML = `
        <div class="card-top">
          <div class="student-name">${student.name}</div>
          <button class="btn-delete-single" onclick="deleteStudent(${student.id}, event)" title="مسح الطالب">مسح 🗑️</button>
        </div>
        <div class="student-info">الهاتف: ${student.phone}</div>
        <div class="student-info" style="margin-top:8px; font-weight:bold; color:var(--danger-color);">المتبقي: ${student.balance}</div>
      `;
      studentsGrid.appendChild(card);
    });
  }

  // 3. مسح طالب واحد
  function deleteStudent(studentId, event) {
    event.stopPropagation();
    
    const student = studentsData.find(s => s.id === studentId);
    if (student && confirm(`هل أنت تأكد من مسح بيانات الطالب (${student.name})؟`)) {
      studentsData = studentsData.filter(s => s.id !== studentId);
      renderStudentsList();
    }
  }

  // 4. مسح جميع الطلاب دفعة واحدة
  function deleteAllStudents() {
    if (studentsData.length === 0) {
      alert("قائمة الطلاب فارغة بالفعل!");
      return;
    }

    if (confirm("⚠️ تحذير: هل أنت متأكد من مسح جميع الطلاب المسجلين وكافة تقاريرهم دفعة واحدة؟")) {
      studentsData = [];
      renderStudentsList();
      showView('main-view');
    }
  }

  // 5. فتح تقارير وحركات الطالب المحفوظة
  function openStudentProfile(studentId) {
    const student = studentsData.find(s => s.id === studentId);
    if (!student) return;

    currentSelectedStudent = student;

    document.getElementById('detailName').textContent = student.name;
    document.getElementById('detailPhone').textContent = "رقم الهاتف: " + student.phone;
    document.getElementById('detailTotalOps').textContent = student.transactions ? student.transactions.length : 0;
    document.getElementById('detailBalance').textContent = student.balance;

    const tbody = document.getElementById('transactionsBody');
    tbody.innerHTML = '';

    if (!student.transactions || student.transactions.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="no-data">لا توجد حركات أو تقارير مسجلة لهذا الطالب حتى الآن</td></tr>';
    } else {
      student.transactions.forEach(tx => {
        const tr = document.createElement('tr');
        const badgeClass = tx.isPay ? 'badge-pay' : 'badge-fee';
        tr.innerHTML = `
          <td>${tx.date}</td>
          <td><span class="badge ${badgeClass}">${tx.type}</span></td>
          <td>${tx.desc}</td>
          <td style="font-weight:bold;">${tx.amount}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    showView('student-detail-view');
  }

  // 6. مشاركة التقرير المحفوظ مع ولي الأمر عبر الواتساب
  function shareReportWithGuardian() {
    if (!currentSelectedStudent) return;

    let reportText = `📋 *تقرير الطالب:* ${currentSelectedStudent.name}\n`;
    reportText += `📞 *رقم التواصل:* ${currentSelectedStudent.phone}\n`;
    reportText += `💰 *المتبقي / الحساب:* ${currentSelectedStudent.balance}\n`;
    reportText += `-----------------------------------\n`;
    reportText += `📑 *سجل العمليات والتقارير المحفوظة:*\n`;

    if (!currentSelectedStudent.transactions || currentSelectedStudent.transactions.length === 0) {
      reportText += `لا توجد عمليات مسجلة حاليًا.\n`;
    } else {
      currentSelectedStudent.transactions.forEach((tx, idx) => {
        reportText += `\n${idx + 1}- *${tx.type}* (${tx.date})\n   البيان: ${tx.desc}\n   المبلغ: ${tx.amount}\n`;
      });
    }

    const phone = currentSelectedStudent.phone ? currentSelectedStudent.phone.replace(/[^0-9]/g, '') : '';
    const encodedText = encodeURIComponent(reportText);
    const whatsappUrl = phone ? `https://wa.me/2${phone}?text=${encodedText}` : `https://api.whatsapp.com/send?text=${encodedText}`;

    window.open(whatsappUrl, '_blank');
  }

  // التنقل بين الشاشات
  function showView(viewId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    if(viewId === 'main-view') {
      document.getElementById('page-title').textContent = "صفحة الطلاب";
      searchInput.value = '';
    } else {
      document.getElementById('page-title').textContent = "ملف الطالب / استعراض التقرير";
    }
  }

  // تهيئة عرض القائمة
  renderStudentsList();
</script>

</body>
</html>
