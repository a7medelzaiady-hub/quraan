<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجلات الطلاب | مركز خادم القرآن الكريم</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --ink:#10332b;
    --ink-2:#1c473b;
    --parchment:#f6f2e8;
    --panel:#ffffff;
    --sage:#eaf0e9;
    --gold:#b8863a;
    --gold-deep:#8f6423;
    --gold-soft:#f1e4c8;
    --rose:#9c4a3c;
    --rose-soft:#f4e4e0;
    --line:#e1d9c4;
    --text:#26302b;
    --muted:#72796f;
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--parchment);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    padding:18px 14px 60px;
  }
  .container{max-width:640px; margin:0 auto;}

  h1,h2,h3,.display{font-family:'Amiri', serif;}

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--ink);
    background-image: radial-gradient(circle at 15% 20%, rgba(255,255,255,.05), transparent 40%);
    color:#f4efe1;
    border-radius:var(--radius);
    padding:18px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    margin-bottom:18px;
  }
  .topbar h1{font-size:19px; font-weight:700; letter-spacing:.2px;}
  .topbar .sub{font-size:11px; color:#cbd9d1; margin-top:2px; font-family:'Tajawal';}
  .topbtns{display:flex; gap:8px;}
  .pill-btn{
    border:1px solid rgba(244,239,225,.35);
    background:transparent; color:#f4efe1;
    padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:700;
    cursor:pointer; transition:.2s; font-family:'Tajawal';
  }
  .pill-btn:hover{background:rgba(244,239,225,.12);}
  .pill-btn.danger{border-color:rgba(200,110,90,.5); color:#e7bdb2;}
  .pill-btn.danger:hover{background:rgba(156,74,60,.25);}

  /* ---------- Panels ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
  }
  .panel-title{
    font-size:13px; font-weight:800; color:var(--gold-deep);
    text-transform:uppercase; letter-spacing:.6px; margin-bottom:14px;
    display:flex; align-items:center; gap:8px;
  }
  .panel-title::before{content:''; width:14px; height:2px; background:var(--gold); display:inline-block;}

  /* ---------- Search ---------- */
  .search-wrap{position:relative;}
  .search-input{
    width:100%; padding:13px 16px; border:1.5px solid var(--line); border-radius:11px;
    font-size:15px; font-family:'Tajawal'; outline:none; background:var(--parchment);
    transition:.2s;
  }
  .search-input:focus{border-color:var(--ink-2); background:#fff;}
  .dropdown-menu{
    position:absolute; top:calc(100% + 6px); left:0; right:0; background:#fff;
    border:1px solid var(--line); border-radius:11px; max-height:230px; overflow-y:auto;
    box-shadow:0 10px 24px rgba(16,51,43,.14); z-index:50; display:none;
  }
  .dropdown-item{padding:12px 15px; border-bottom:1px solid #f1ede0; cursor:pointer; font-weight:700; font-size:14px;}
  .dropdown-item:last-child{border-bottom:none;}
  .dropdown-item:hover{background:var(--sage); color:var(--ink);}

  /* ---------- Student grid ---------- */
  .students-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-top:14px;}
  .student-card{
    background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:15px;
    cursor:pointer; transition:.2s; display:flex; flex-direction:column; gap:8px;
  }
  .student-card:hover{border-color:var(--gold); box-shadow:0 6px 16px rgba(16,51,43,.08); transform:translateY(-2px);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .student-name{font-weight:800; font-size:15.5px; color:var(--ink);}
  .del-btn{background:var(--rose-soft); color:var(--rose); border:1px solid #e6c3ba; padding:4px 9px; border-radius:7px; font-size:11px; font-weight:700; cursor:pointer;}
  .del-btn:hover{background:var(--rose); color:#fff;}
  .student-meta{font-size:12.5px; color:var(--muted);}
  .student-meta b{color:var(--ink-2);}
  .no-data{grid-column:1/-1; text-align:center; color:var(--muted); padding:20px; font-size:13.5px;}

  /* ---------- Views ---------- */
  .view-section{display:none;}
  .view-section.active{display:block;}
  .back-btn{
    background:none; border:1px solid var(--line); color:var(--ink-2); padding:8px 15px;
    border-radius:999px; cursor:pointer; margin-bottom:14px; font-weight:700; font-size:13px;
    font-family:'Tajawal'; display:inline-flex; align-items:center; gap:6px; transition:.2s;
  }
  .back-btn:hover{background:var(--sage); border-color:var(--ink-2);}

  .student-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
  .student-head h2{font-size:22px; color:var(--ink); font-weight:700;}
  .student-head .phone{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .actions-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
  .btn{
    border:none; padding:10px 16px; border-radius:10px; font-weight:700; font-size:13px;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:.2s; font-family:'Tajawal';
  }
  .btn-whatsapp{background:#1f8a5c; color:#fff;}
  .btn-whatsapp:hover{background:#186f49;}
  .btn-image{background:var(--ink); color:#f4efe1;}
  .btn-image:hover{background:var(--ink-2);}
  .btn-ghost{background:var(--sage); color:var(--ink-2); border:1px solid var(--line);}
  .btn-ghost:hover{background:#dfe8dd;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* ---------- Timeline of dates ---------- */
  .timeline{position:relative; padding-inline-start:26px;}
  .timeline::before{
    content:''; position:absolute; right:8px; top:4px; bottom:4px; width:2px;
    background:linear-gradient(var(--gold-soft), var(--line));
  }
  .timeline-item{position:relative; padding:6px 0 14px;}
  .timeline-item:last-child{padding-bottom:0;}
  .bead{
    position:absolute; right:0px; top:8px; width:18px; height:18px; border-radius:50%;
    background:#fff; border:2.5px solid var(--gold-soft); transition:.2s;
  }
  .timeline-item.selected .bead{background:var(--gold); border-color:var(--gold-deep);}
  .timeline-btn{
    width:100%; text-align:right; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:11px 15px; cursor:pointer; transition:.2s; font-family:'Tajawal';
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .timeline-item.selected .timeline-btn{border-color:var(--gold); background:var(--gold-soft); box-shadow:0 3px 10px rgba(184,134,58,.15);}
  .timeline-btn:hover{border-color:var(--gold);}
  .timeline-date{font-weight:800; font-size:14px; color:var(--ink);}
  .timeline-count{font-size:11.5px; color:var(--muted); background:var(--sage); padding:2px 9px; border-radius:999px; font-weight:700;}
  .timeline-item.selected .timeline-count{background:#fff;}

  /* ---------- Data table ---------- */
  .entry-row{
    display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:10px; align-items:center;
    padding:12px 6px; border-bottom:1px solid #f0ece0;
  }
  .entry-row:last-child{border-bottom:none;}
  .entry-row.head{font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  .entry-cat{display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:13.5px; color:var(--ink);}
  .entry-cat .dot{width:8px; height:8px; border-radius:50%;}
  .dot.new{background:#3f7a5e;}
  .dot.past{background:var(--gold);}
  .dot.adhkar{background:#4c6f8a;}
  .entry-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .tag{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:7px; margin-inline-end:5px; margin-top:3px;}
  .tag.grade{background:var(--gold-soft); color:var(--gold-deep);}
  .tag.error{background:var(--rose-soft); color:var(--rose);}
  .tag.plan{background:var(--sage); color:var(--ink-2); display:block; margin-top:6px;}
  @media (max-width:520px){
    .entry-row{grid-template-columns:1fr; gap:4px;}
    .entry-row.head{display:none;}
  }

  .empty-state{text-align:center; padding:30px 10px; color:var(--muted); font-size:13.5px;}
  .empty-state .icon{font-size:26px; display:block; margin-bottom:8px;}

  /* ---------- Off-screen report render target ---------- */
  #reportSandbox{position:fixed; top:0; left:-99999px; z-index:-1;}
</style>
</head>
<body>

<div class="container">

  <div class="topbar">
    <div>
      <h1 id="page-title">سجلات الطلاب</h1>
      <div class="sub">مركز خادم القرآن الكريم — متابعة الحفظ</div>
    </div>
    <div class="topbtns">
      <button class="pill-btn" onclick="window.location.href='index1.html'">الرئيسية</button>
      <button class="pill-btn danger" onclick="deleteAllStudents()">مسح الكل</button>
    </div>
  </div>

  <!-- MAIN VIEW -->
  <div id="main-view" class="view-section active">
    <div class="panel">
      <div class="panel-title">بحث سريع</div>
      <div class="search-wrap">
        <input type="text" id="studentSearchInput" class="search-input" placeholder="اكتب اسم الطالب..." autocomplete="off">
        <div id="customDropdown" class="dropdown-menu"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">جميع الطلاب</div>
      <div id="studentsGrid" class="students-grid"></div>
    </div>
  </div>

  <!-- STUDENT DETAIL VIEW -->
  <div id="student-detail-view" class="view-section">
    <button class="back-btn" onclick="showView('main-view')">→ العودة لقائمة الطلاب</button>

    <div class="panel">
      <div class="student-head">
        <div>
          <h2 id="detailName">اسم الطالب</h2>
          <div class="phone" id="detailPhone"></div>
        </div>
      </div>
      <div class="actions-row">
        <button class="btn btn-image" id="btnFullImage" onclick="exportFullRecord('image')">تحميل السجل الكامل كصورة</button>
        <button class="btn btn-whatsapp" id="btnFullWA" onclick="exportFullRecord('whatsapp')">مشاركة السجل الكامل واتساب</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">التواريخ المسجّلة</div>
      <div id="timelineList" class="timeline"></div>
    </div>

    <div class="panel">
      <div class="panel-title" id="dayPanelTitle">بيانات اليوم المختار</div>
      <div id="dayTable"></div>
      <div class="actions-row">
        <button class="btn btn-image" id="btnDayImage" onclick="exportSelectedDay('image')" disabled>تحميل تقرير هذا اليوم</button>
        <button class="btn btn-whatsapp" id="btnDayWA" onclick="exportSelectedDay('whatsapp')" disabled>مشاركة هذا اليوم واتساب</button>
      </div>
    </div>
  </div>

</div>

<div id="reportSandbox"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
    authDomain: "ahmedelzaiady.firebaseapp.com",
    projectId: "ahmedelzaiady",
    storageBucket: "ahmedelzaiady.firebasestorage.app",
    messagingSenderId: "300306825071",
    appId: "1:300306825071:web:0426ddde56280fa090329a",
    measurementId: "G-WE04GK5XZZ"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const studentsCollection = db.collection('students');

  let studentsData = [];
  let currentSelectedStudent = null;
  let currentSelectedDateKey = null;

  const CAT_LABELS = { new: 'سور جديدة', past: 'ماضي السور', adhkar: 'حديث وأذكار' };
  const CAT_DOT = { new: 'new', past: 'past', adhkar: 'adhkar' };

  const searchInput = document.getElementById('studentSearchInput');
  const dropdown = document.getElementById('customDropdown');
  const studentsGrid = document.getElementById('studentsGrid');

  studentsCollection.onSnapshot((snapshot) => {
    studentsData = [];
    snapshot.forEach((doc) => studentsData.push({ id: doc.id, ...doc.data() }));
    renderStudentsList();
    if (currentSelectedStudent) {
      const updated = studentsData.find(s => s.id === currentSelectedStudent.id);
      if (updated) openStudentProfile(updated.id, currentSelectedDateKey);
    }
  }, (error) => console.error("خطأ في الفايربيس:", error));

  searchInput.addEventListener('input', function () {
    const query = this.value.trim().toLowerCase();
    dropdown.innerHTML = '';
    if (query === '') { dropdown.style.display = 'none'; return; }
    const filtered = studentsData.filter(s => (s.name || s.studentName) && (s.name || s.studentName).toLowerCase().includes(query));
    if (filtered.length > 0) {
      filtered.forEach(student => {
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        item.textContent = student.name || student.studentName;
        item.onclick = () => { searchInput.value = ''; dropdown.style.display = 'none'; openStudentProfile(student.id); };
        dropdown.appendChild(item);
      });
      dropdown.style.display = 'block';
    } else dropdown.style.display = 'none';
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) dropdown.style.display = 'none';
  });

  function renderStudentsList() {
    studentsGrid.innerHTML = '';
    if (studentsData.length === 0) {
      studentsGrid.innerHTML = '<div class="no-data">لا يوجد طلاب مسجلون حاليًا.</div>';
      return;
    }
    studentsData.forEach(student => {
      const card = document.createElement('div');
      card.className = 'student-card';
      card.onclick = () => openStudentProfile(student.id);
      const studentName = student.name || student.studentName || 'بدون اسم';
      const txCount = student.transactions ? student.transactions.length : 0;
      const dateCount = getStudentDates(student).length;
      card.innerHTML = `
        <div class="card-top">
          <div class="student-name">${studentName}</div>
          <button class="del-btn" onclick="deleteStudent('${student.id}', event)">مسح</button>
        </div>
        <div class="student-meta">الهاتف: ${student.phone || 'غير مسجل'}</div>
        <div class="student-meta"><b>${dateCount}</b> تاريخ متابعة &middot; <b>${txCount}</b> تقرير</div>
      `;
      studentsGrid.appendChild(card);
    });
  }

  async function deleteStudent(studentId, event) {
    event.stopPropagation();
    const student = studentsData.find(s => s.id === studentId);
    const sName = student ? (student.name || student.studentName) : '';
    if (student && confirm(`هل أنت متأكد من مسح بيانات الطالب (${sName}) وكافة تقاريره؟`)) {
      try { await studentsCollection.doc(String(studentId)).delete(); }
      catch (err) { alert("حدث خطأ أثناء المسح: " + err.message); }
    }
  }

  async function deleteAllStudents() {
    if (studentsData.length === 0) { alert("قائمة الطلاب فارغة بالفعل!"); return; }
    if (confirm("تحذير: هل أنت متأكد من مسح جميع الطلاب المسجلين وكافة تقاريرهم؟")) {
      try {
        const batch = db.batch();
        const snapshot = await studentsCollection.get();
        snapshot.docs.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        showView('main-view');
      } catch (err) { alert("حدث خطأ أثناء مسح الكل: " + err.message); }
    }
  }

  // ---------- Date helpers ----------
  function getTxDateKey(tx) {
    if (tx.date) {
      const d = new Date(tx.date);
      if (!isNaN(d)) return d.toISOString().slice(0, 10);
      return String(tx.date);
    }
    if (tx.createdAt && tx.createdAt.toDate) {
      return tx.createdAt.toDate().toISOString().slice(0, 10);
    }
    return 'undated';
  }

  function formatDateKey(key) {
    if (key === 'undated') return 'بدون تاريخ';
    const d = new Date(key);
    if (isNaN(d)) return key;
    return d.toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function getStudentDates(student) {
    const txs = student.transactions || [];
    const keys = [...new Set(txs.map(getTxDateKey))];
    keys.sort((a, b) => {
      if (a === 'undated') return 1;
      if (b === 'undated') return -1;
      return new Date(b) - new Date(a);
    });
    return keys;
  }

  function getTxsForDate(student, dateKey) {
    return (student.transactions || []).filter(tx => getTxDateKey(tx) === dateKey);
  }

  function txCategory(tx) {
    if (tx.category === 'past' || (tx.type && tx.type.includes('مراجعة'))) return 'past';
    if (tx.category === 'adhkar' || (tx.type && tx.type.includes('حديث'))) return 'adhkar';
    return 'new';
  }

  // ---------- Profile / timeline / table ----------
  function openStudentProfile(studentId, dateKeyToSelect) {
    const student = studentsData.find(s => s.id === studentId);
    if (!student) return;
    currentSelectedStudent = student;

    const sName = student.name || student.studentName || 'الطالب';
    document.getElementById('detailName').textContent = sName;
    document.getElementById('detailPhone').textContent = "الهاتف: " + (student.phone || 'غير مسجل');

    const dates = getStudentDates(student);
    const timelineList = document.getElementById('timelineList');
    timelineList.innerHTML = '';

    const hasFull = (student.transactions || []).length > 0;
    document.getElementById('btnFullImage').disabled = !hasFull;
    document.getElementById('btnFullWA').disabled = !hasFull;

    if (dates.length === 0) {
      timelineList.innerHTML = '<div class="empty-state"><span class="icon">📅</span>لا توجد تقارير مسجلة لهذا الطالب بعد.</div>';
    } else {
      let selectKey = dateKeyToSelect && dates.includes(dateKeyToSelect) ? dateKeyToSelect : dates[0];
      dates.forEach(key => {
        const item = document.createElement('div');
        item.className = 'timeline-item' + (key === selectKey ? ' selected' : '');
        item.innerHTML = `
          <div class="bead"></div>
          <button class="timeline-btn" onclick="selectDate('${key}')">
            <span class="timeline-date">${formatDateKey(key)}</span>
            <span class="timeline-count">${getTxsForDate(student, key).length} بند</span>
          </button>
        `;
        timelineList.appendChild(item);
      });
      renderDayTable(selectKey);
    }

    showView('student-detail-view');
  }

  function selectDate(dateKey) {
    currentSelectedDateKey = dateKey;
    document.querySelectorAll('.timeline-item').forEach(el => el.classList.remove('selected'));
    [...document.querySelectorAll('.timeline-btn')].forEach(btn => {
      if (btn.querySelector('.timeline-date').textContent === formatDateKey(dateKey)) {
        btn.closest('.timeline-item').classList.add('selected');
      }
    });
    renderDayTable(dateKey);
  }

  function renderDayTable(dateKey) {
    currentSelectedDateKey = dateKey;
    document.getElementById('dayPanelTitle').textContent = 'بيانات يوم: ' + formatDateKey(dateKey);
    const txs = getTxsForDate(currentSelectedStudent, dateKey);
    const wrap = document.getElementById('dayTable');
    document.getElementById('btnDayImage').disabled = txs.length === 0;
    document.getElementById('btnDayWA').disabled = txs.length === 0;

    if (txs.length === 0) {
      wrap.innerHTML = '<div class="empty-state"><span class="icon">📖</span>لا توجد بيانات لهذا اليوم.</div>';
      return;
    }

    let html = `<div class="entry-row head">
      <div>البند</div><div>التقييم / النطاق</div><div>ملاحظات</div>
    </div>`;
    txs.forEach(tx => {
      const cat = txCategory(tx);
      html += `<div class="entry-row">
        <div>
          <div class="entry-cat"><span class="dot ${CAT_DOT[cat]}"></span>${tx.surah || tx.type || 'بند'}</div>
          <div class="entry-sub">${CAT_LABELS[cat]}${tx.range ? ' &middot; نطاق ' + tx.range : ''}</div>
        </div>
        <div>${tx.amount ? `<span class="tag grade">${tx.amount}</span>` : ''}</div>
        <div>
          ${tx.desc ? `<span class="tag error">${tx.desc}</span>` : ''}
          ${tx.nextPlan ? `<span class="tag plan">الخطة القادمة: ${tx.nextPlan}</span>` : ''}
        </div>
      </div>`;
    });
    wrap.innerHTML = html;
  }

  // ---------- Report building (image export) - INDEX1 DESIGN MATCH ----------
  function buildReportCard(sName, subtitleText, groupedByDate) {
    // groupedByDate: [{ key, label, txs: [...] }]
    const card = document.createElement('div');
    card.style.cssText = `
      width: 480px;
      background: #f6f2e8;
      border: 1px solid #e1d9c4;
      border-radius: 20px;
      overflow: hidden;
      font-family: 'Tajawal', sans-serif;
      direction: rtl;
      color: #26302b;
      box-sizing: border-box;
      padding-bottom: 0;
    `;

    let sectionsHtml = '';
    groupedByDate.forEach(group => {
      sectionsHtml += `
        <div style="margin: 18px 20px 8px; display: flex; align-items: center; gap: 8px;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: #b8863a;"></div>
          <div style="font-family: 'Amiri', serif; font-weight: 700; font-size: 16px; color: #10332b;">${group.label}</div>
          <div style="flex: 1; height: 1px; background: #e1d9c4;"></div>
        </div>`;
      
      ['new', 'past', 'adhkar'].forEach(catKey => {
        const catTxs = group.txs.filter(tx => txCategory(tx) === catKey);
        if (catTxs.length === 0) return;
        
        sectionsHtml += `
          <div style="margin: 8px 20px 4px; font-size: 12px; font-weight: 800; color: #8f6423; display: flex; align-items: center; gap: 6px;">
            <span>◆</span> ${CAT_LABELS[catKey]}
          </div>`;

        catTxs.forEach(tx => {
          const borderColor = catKey === 'new' ? '#3f7a5e' : catKey === 'past' ? '#b8863a' : '#4c6f8a';
          
          sectionsHtml += `
            <div style="background: #ffffff; border: 1px solid #e1d9c4; border-right: 4px solid ${borderColor}; border-radius: 14px; margin: 6px 20px 10px; padding: 12px 15px; box-shadow: 0 2px 6px rgba(16,51,43,0.03);">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px;">
                <div style="font-weight: 800; font-size: 15.5px; color: #10332b;">${tx.surah || tx.type || 'بند'}</div>
                ${tx.range ? `<div style="font-size: 11.5px; font-weight: 700; color: #1c473b; background: #eaf0e9; padding: 3px 10px; border-radius: 8px;">نطاق: ${tx.range}</div>` : ''}
              </div>
              
              <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px;">
                ${tx.amount ? `<span style="font-size: 11.5px; font-weight: 700; color: #8f6423; background: #f1e4c8; padding: 3px 10px; border-radius: 8px;">⭐ ${tx.amount}</span>` : ''}
                ${tx.desc ? `<span style="font-size: 11.5px; font-weight: 700; color: #9c4a3c; background: #f4e4e0; padding: 3px 10px; border-radius: 8px;">⚠️ ${tx.desc}</span>` : ''}
              </div>

              ${tx.nextPlan ? `
                <div style="margin-top: 8px; font-size: 12px; font-weight: 700; color: #1c473b; background: #eaf0e9; border: 1px dashed #b8863a; border-radius: 8px; padding: 8px 11px;">
                  📍 الخطة القادمة: ${tx.nextPlan}
                </div>` : ''}
            </div>`;
        });
      });
    });

    const nowStr = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    card.innerHTML = `
      <!-- Top Header -->
      <div style="background: #10332b; background-image: radial-gradient(circle at 15% 20%, rgba(255,255,255,.08), transparent 40%); color: #f4efe1; text-align: center; padding: 24px 16px; border-bottom: 3px solid #b8863a;">
        <div style="font-family: 'Amiri', serif; font-size: 22px; font-weight: 700; letter-spacing: 0.5px;">مركز خادم القرآن الكريم</div>
        <div style="font-size: 12px; color: #cbd9d1; margin-top: 4px; font-family: 'Tajawal', sans-serif;">تحت إشراف الشيخ عبدالرحمن</div>
      </div>

      <!-- Student Badge -->
      <div style="text-align: center; margin: -18px 20px 10px; position: relative; z-index: 2;">
        <div style="display: inline-block; background: #ffffff; border: 2px solid #b8863a; color: #10332b; padding: 8px 28px; border-radius: 50px; box-shadow: 0 4px 12px rgba(16,51,43,0.1);">
          <span style="font-family: 'Amiri', serif; font-weight: 700; font-size: 19px;">🏆 الطالب: ${sName}</span>
        </div>
      </div>

      <!-- Subtitle Tag -->
      <div style="text-align: center; margin-bottom: 12px;">
        <span style="background: #eaf0e9; border: 1px solid #e1d9c4; color: #1c473b; font-size: 11.5px; font-weight: 700; padding: 4px 14px; border-radius: 12px; display: inline-block;">
          ${subtitleText}
        </span>
      </div>

      <!-- Content Sections -->
      <div style="padding-bottom: 10px;">
        ${sectionsHtml}
      </div>

      <!-- Footer -->
      <div style="background: #10332b; color: #cbd9d1; text-align: center; padding: 14px; font-size: 11px; margin-top: 10px; border-top: 1px solid #b8863a;">
        <div style="font-weight: 700; color: #f4efe1; margin-bottom: 2px;">مركز خادم القرآن الكريم &middot; تقرير متابعة الحفظ</div>
        <div>تاريخ إصدار التقرير: ${nowStr}</div>
      </div>
    `;
    return card;
  }

  async function renderCardToImage(card, filename) {
    const sandbox = document.getElementById('reportSandbox');
    sandbox.innerHTML = '';
    sandbox.appendChild(card);
    await new Promise(r => setTimeout(r, 60));
    const canvas = await html2canvas(card, { scale: 2, useCORS: true, backgroundColor: '#fbf8f1' });
    const link = document.createElement('a');
    link.download = filename;
    link.href = canvas.toDataURL('image/png');
    link.click();
    sandbox.innerHTML = '';
  }

  function buildWhatsappText(sName, groups) {
    let text = `📋 *تقرير متابعة الطالب:* ${sName}\n-----------------------------------\n`;
    groups.forEach(group => {
      text += `\n🗓️ *${group.label}*\n`;
      if (group.txs.length === 0) { text += `لا توجد بيانات.\n`; return; }
      group.txs.forEach((tx, idx) => {
        text += `${idx + 1}. *${tx.surah || tx.type || 'بند'}*${tx.range ? ' (نطاق ' + tx.range + ')' : ''}\n   التقييم: ${tx.amount || '—'}\n   الملاحظات: ${tx.desc || 'لا يوجد'}\n${tx.nextPlan ? '   الخطة القادمة: ' + tx.nextPlan + '\n' : ''}`;
      });
    });
    return text;
  }

  function openWhatsapp(student, text) {
    const phone = student.phone ? student.phone.replace(/[^0-9]/g, '') : '';
    const encodedText = encodeURIComponent(text);
    const url = phone ? `https://wa.me/2${phone}?text=${encodedText}` : `https://api.whatsapp.com/send?text=${encodedText}`;
    window.open(url, '_blank');
  }

  // ---------- Export actions: single selected day ----------
  function exportSelectedDay(mode) {
    if (!currentSelectedStudent || !currentSelectedDateKey) return;
    const sName = currentSelectedStudent.name || currentSelectedStudent.studentName || 'الطالب';
    const txs = getTxsForDate(currentSelectedStudent, currentSelectedDateKey);
    const group = { key: currentSelectedDateKey, label: formatDateKey(currentSelectedDateKey), txs };

    if (mode === 'image') {
      const card = buildReportCard(sName, formatDateKey(currentSelectedDateKey), [group]);
      renderCardToImage(card, `تقرير_${sName}_${currentSelectedDateKey}.png`);
    } else {
      openWhatsapp(currentSelectedStudent, buildWhatsappText(sName, [group]));
    }
  }

  // ---------- Export actions: full record (all dates) ----------
  function exportFullRecord(mode) {
    if (!currentSelectedStudent) return;
    const sName = currentSelectedStudent.name || currentSelectedStudent.studentName || 'الطالب';
    const dates = getStudentDates(currentSelectedStudent);
    const groups = dates.map(key => ({ key, label: formatDateKey(key), txs: getTxsForDate(currentSelectedStudent, key) }));

    if (mode === 'image') {
      const card = buildReportCard(sName, `السجل الكامل &middot; ${dates.length} تاريخ`, groups);
      renderCardToImage(card, `السجل_الكامل_${sName}.png`);
    } else {
      openWhatsapp(currentSelectedStudent, buildWhatsappText(sName, groups));
    }
  }

  function showView(viewId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    if (viewId === 'main-view') {
      document.getElementById('page-title').textContent = "سجلات الطلاب";
      searchInput.value = '';
    } else {
      document.getElementById('page-title').textContent = "ملف الطالب";
    }
  }
</script>

</body>
