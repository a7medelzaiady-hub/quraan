<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل وتعارير الطلاب المحفوظة</title>
  <style>
    :root {
      --bg-color: #031c16;
      --card-bg: #0d4236;
      --card-border: #185a4a;
      --accent-gold: #e2b765;
      --btn-bg: #105344;
      --danger-bg: #2a1b1b;
      --danger-border: #4a2727;
      --danger-text: #ff6b6b;
      --text-main: #ffffff;
      --text-sub: #b2cbbd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* الهيدر */
    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.3rem;
      color: var(--accent-gold);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background-color: transparent;
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .btn-danger-outline {
      background-color: transparent;
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    /* مربع البحث */
    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background-color: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .search-box input::placeholder {
      color: var(--text-sub);
    }

    .search-box .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.6;
    }

    /* صف الطالب (الكارت + السلة) */
    .student-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    /* كارت الطالب الرئيسي */
    .student-card {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .student-card:active {
      background-color: var(--btn-bg);
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .student-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .badge {
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--accent-gold);
    }

    .arrow-icon {
      transition: transform 0.3s;
      font-size: 0.8rem;
      opacity: 0.7;
    }

    /* زر الحذف المستقل */
    .delete-btn {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s, background-color 0.2s;
    }

    .delete-btn:active {
      transform: scale(0.92);
      background-color: #3d2323;
    }

    /* تفاصيل التقارير عند الفتح */
    .reports-container {
      display: none;
      padding: 10px 16px;
      margin-top: -6px;
      margin-bottom: 12px;
      background-color: rgba(0, 0, 0, 0.15);
      border-radius: 0 0 16px 16px;
      border: 1px solid var(--card-border);
      border-top: none;
    }

    .reports-container.active {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>📂 سجل وتعارير الطلاب المحفوظة</h1>
    <p>إدارة واستعراض ومشاركة التقارير السابقة (من الأحدث للأقدم)</p>
    <div class="header-actions">
      <button class="btn btn-primary">← العودة للإدخال</button>
      <button class="btn btn-danger-outline" onclick="clearAllData()">🗑️ تصغير البيانات</button>
    </div>
  </header>

  <main>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="ابحث عن اسم الطالب..." oninput="handleSearch()">
    </div>

    <div id="studentsList">
      <!-- يتم توليد القائمة هنا عن طريق JavaScript -->
    </div>
  </main>

  <script>
    // بيانات أولية مع خيار التخزين المحلي لسرعة التحميل
    const initialStudents = [
      { id: 1, name: "رقية محمد", reportsCount: 0 },
      { id: 2, name: "محمود احمد", reportsCount: 0 },
      { id: 3, name: "يوسف احمد", reportsCount: 0 }
    ];

    let debounceTimer;

    // جلب البيانات مع تقليل الاستهلاك عبر LocalStorage
    function getStudents() {
      const cached = localStorage.getItem('students_cache');
      if (cached) return JSON.parse(cached);
      
      localStorage.setItem('students_cache', JSON.stringify(initialStudents));
      return initialStudents;
    }

    // عرض القائمة
    function renderStudents(filter = "") {
      const listContainer = document.getElementById('studentsList');
      const students = getStudents();
      listContainer.innerHTML = "";

      const filtered = students.filter(s => s.name.includes(filter.trim()));

      filtered.forEach(student => {
        const row = document.createElement('div');
        row.className = 'student-row';
        row.id = `student-row-${student.id}`;

        row.innerHTML = `
          <div class="student-card" onclick="toggleReports(${student.id})">
            <div class="student-info">
              <span>👤</span>
              <span class="student-name">${student.name}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <span class="badge">${student.reportsCount} تقرير</span>
              <span class="arrow-icon" id="arrow-${student.id}">▼</span>
            </div>
          </div>
          <button class="delete-btn" onclick="deleteStudent(${student.id})" title="حذف الطالب">
            🗑️
          </button>
        `;

        const reportsDiv = document.createElement('div');
        reportsDiv.className = 'reports-container';
        reportsDiv.id = `reports-${student.id}`;
        reportsDiv.innerText = "جاري تحميل التقارير...";

        const wrapper = document.createElement('div');
        wrapper.appendChild(row);
        wrapper.appendChild(reportsDiv);

        listContainer.appendChild(wrapper);
      });
    }

    // جلب التقارير عند الطلب فقط (Lazy Loading) لتقليل استهلاك البيانات
    function toggleReports(id) {
      const reportsDiv = document.getElementById(`reports-${id}`);
      const arrow = document.getElementById(`arrow-${id}`);
      const isOpen = reportsDiv.classList.contains('active');

      document.querySelectorAll('.reports-container').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.arrow-icon').forEach(el => el.style.transform = 'rotate(0deg)');

      if (!isOpen) {
        reportsDiv.classList.add('active');
        arrow.style.transform = 'rotate(180deg)';
        
        // محاكاة جلب تقارير هذا الطالب فقط من السيرفر عند الضغط
        setTimeout(() => {
          reportsDiv.innerHTML = `<small style="color: var(--text-sub)">لا توجد تقارير محفوظة لهذا الطالب.</small>`;
        }, 200);
      }
    }

    // البحث المؤجل (Debounce) لتقليل طلبات السيرفر والمعالجة
    function handleSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        const query = document.getElementById('searchInput').value;
        renderStudents(query);
      }, 250);
    }

    // حذف طالب معين
    function deleteStudent(id) {
      if (confirm("هل أنت تأكد من حذف هذا الطالب؟")) {
        let students = getStudents().filter(s => s.id !== id);
        localStorage.setItem('students_cache', JSON.stringify(students));
        renderStudents(document.getElementById('searchInput').value);
      }
    }

    // تصفير البيانات
    function clearAllData() {
      if (confirm("هل تريد تصفير جميع البيانات؟")) {
        localStorage.removeItem('students_cache');
        renderStudents();
      }
    }

    // العرض الأولي عند فتح الصفحة
    renderStudents();
  </script>

</body>
</html>
