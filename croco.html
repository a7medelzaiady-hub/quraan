<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>مغامرة كروكو الجعان - الأكبر والأصغر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#FFC93C;
    --leaf:#2EC4B6;
    --leaf-dark:#1B9C90;
    --coral:#FF6B6B;
    --sky:#4EA8DE;
    --plum:#2B2140;
    --cream:#FFF8E7;
    --card:#ffffff;
    --shadow: 0 10px 30px rgba(43,33,64,0.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 10%, #FFF3C4 0%, transparent 45%),
      radial-gradient(circle at 90% 85%, #CDEFEB 0%, transparent 40%),
      var(--cream);
    font-family:'Cairo', sans-serif;
    color:var(--plum);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
    -webkit-tap-highlight-color: transparent;
    overflow-x:hidden;
  }
  .display{ font-family:'Baloo Bhaijaan 2', sans-serif; }

  .player{
    width:100%;
    max-width:460px;
    background:var(--card);
    border-radius:28px;
    box-shadow:var(--shadow);
    overflow:hidden;
    border:3px solid #F3E7C9;
    position:relative;
  }

  /* top bar */
  .topbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 14px 8px;
  }
  .topbar h1{
    font-family:'Baloo Bhaijaan 2';
    font-size:1rem;
    font-weight:800;
    margin:0;
    flex:1;
    color:var(--plum);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .mute-btn{
    width:34px;height:34px;border-radius:50%;
    border:none; background:#F3EFE3; color:var(--plum);
    font-size:1rem; cursor:pointer; display:flex;
    align-items:center; justify-content:center;
    transition:transform .15s ease;
  }
  .mute-btn:active{transform:scale(0.9);}

  .progress-track{
    height:6px; background:#F0EAD6; margin:0 14px 10px; border-radius:6px; overflow:hidden;
    display:flex; gap:3px;
  }
  .progress-seg{
    flex:1; background:#E7DFC4; border-radius:6px; position:relative; overflow:hidden;
  }
  .progress-seg .fill{
    position:absolute; inset:0; width:0%; background:var(--leaf);
    transition:width .1s linear;
  }
  .progress-seg.done .fill{width:100%;}

  /* stage */
  .stage{
    position:relative;
    height:400px;
    background:linear-gradient(180deg,#EAF7F0 0%, #DFF3E8 60%, #CFEBD9 100%);
    overflow:hidden;
  }
  .stage::before{ /* ground */
    content:"";
    position:absolute; bottom:0; left:0; right:0; height:56px;
    background:#3E9E67;
    border-top-left-radius:50% 20px; border-top-right-radius:50% 20px;
  }
  .scene{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:18px 16px 60px;
    opacity:0; transform:translateY(14px) scale(0.98);
    pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
    text-align:center;
  }
  .scene.active{
    opacity:1; transform:translateY(0) scale(1);
    pointer-events:auto;
  }

  .caption{
    font-family:'Baloo Bhaijaan 2';
    font-weight:800;
    font-size:1.15rem;
    color:var(--plum);
    background:rgba(255,255,255,0.88);
    padding:8px 16px;
    border-radius:16px;
    line-height:1.5;
    box-shadow:0 4px 14px rgba(43,33,64,0.1);
    max-width:92%;
  }
  .subcaption{
    font-size:0.82rem;
    font-weight:700;
    color:#5C5170;
    margin-top:6px;
  }

  /* croco character */
  .croco{
    width:150px; margin-bottom:8px;
    filter:drop-shadow(0 6px 10px rgba(43,33,64,0.18));
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-1deg);}
    50%{transform:translateY(-8px) rotate(1deg);}
  }
  .croco .mouth{ transform-origin: 70px 78px; transition: transform .5s cubic-bezier(.34,1.56,.64,1); }
  .croco.open-left .mouth{ transform: rotate(-26deg); }
  .croco.open-right .mouth{ transform: rotate(26deg) scaleX(-1) translateX(-140px); }

  /* counting intro number */
  .big-number{
    font-family:'Baloo Bhaijaan 2';
    font-weight:800;
    font-size:5.2rem;
    line-height:1;
    color:var(--leaf-dark);
    text-shadow: 3px 3px 0 #C9F0E4;
    animation: pop .45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop{ from{transform:scale(0.5); opacity:0;} to{transform:scale(1); opacity:1;} }
  .dots-row{
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px; max-width:280px; margin-top:10px; min-height:34px;
  }
  .dots-row span{
    font-size:1.35rem;
    animation: pop .35s ease backwards;
  }

  /* compare layout */
  .compare-wrap{
    display:flex; align-items:flex-end; justify-content:center; gap:6px; width:100%;
  }
  .pile{
    flex:1; max-width:150px;
    background:rgba(255,255,255,0.7);
    border-radius:18px;
    padding:10px 6px 8px;
    display:flex; flex-direction:column; align-items:center;
    border:3px solid transparent;
    transition: border-color .3s ease, transform .3s ease;
  }
  .pile.winner{ border-color: var(--sun); transform: translateY(-6px) scale(1.04); background:#FFFBEF; }
  .pile .count-label{
    font-family:'Baloo Bhaijaan 2'; font-weight:800; font-size:2.1rem; color:var(--plum);
  }
  .pile .items{
    display:flex; flex-wrap:wrap; justify-content:center; gap:2px; min-height:66px; align-items:center;
  }
  .pile .items span{ font-size:1.15rem; }
  .pile .empty-note{ font-size:0.72rem; font-weight:700; color:#9A8FAE; }

  .symbol-badge{
    font-family:'Baloo Bhaijaan 2'; font-weight:800; font-size:2.4rem; color:var(--coral);
    align-self:center; margin-bottom:26px;
    animation: pop .4s ease backwards; animation-delay:.5s;
    opacity:0; animation-fill-mode:forwards;
  }

  .stars-row{ display:flex; gap:4px; margin-top:8px; }
  .stars-row span{ font-size:1.4rem; animation: twinkle 1.2s ease infinite; }
  .stars-row span:nth-child(2){animation-delay:.15s;}
  .stars-row span:nth-child(3){animation-delay:.3s;}
  @keyframes twinkle{ 0%,100%{transform:scale(1) rotate(0);} 50%{transform:scale(1.25) rotate(8deg);} }

  .recap-row{ display:flex; gap:14px; margin-top:10px; }
  .recap-item{
    background:#fff; border-radius:14px; padding:10px 12px; box-shadow:0 3px 10px rgba(43,33,64,0.1);
    display:flex; flex-direction:column; align-items:center; gap:4px; width:88px;
  }
  .recap-item .sym{ font-family:'Baloo Bhaijaan 2'; font-size:1.7rem; font-weight:800; color:var(--leaf-dark);}
  .recap-item .lbl{ font-size:0.68rem; font-weight:700; }

  .confetti{ position:absolute; top:-10px; font-size:1.2rem; animation: fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(430px) rotate(360deg); opacity:0.2; } }

  /* controls */
  .controls{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:14px 16px 18px;
  }
  .ctrl-btn{
    border:none; background:#F3EFE3; color:var(--plum);
    width:44px; height:44px; border-radius:50%;
    font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, background .15s ease;
  }
  .ctrl-btn:active{transform:scale(0.88);}
  .ctrl-btn.main{
    width:58px; height:58px; background:var(--leaf); color:#fff; font-size:1.4rem;
    box-shadow:0 6px 14px rgba(46,196,182,0.4);
  }
  .ctrl-btn:disabled{ opacity:0.35; }

  .tap-hint{
    text-align:center; font-size:0.72rem; color:#9A8FAE; padding-bottom:12px; font-weight:700;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>

<div class="player">
  <div class="topbar">
    <h1>🐊 مغامرة كروكو الجعان</h1>
    <button class="mute-btn" id="muteBtn" title="الصوت">🔊</button>
  </div>
  <div class="progress-track" id="progressTrack"></div>

  <div class="stage" id="stage"></div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn" title="السابق">⏮</button>
    <button class="ctrl-btn main" id="playBtn" title="تشغيل">▶</button>
    <button class="ctrl-btn" id="nextBtn" title="التالي">⏭</button>
  </div>
  <div class="tap-hint">اضغطي ▶ لتشغيل القصة، أو استخدمي الأسهم للتنقل يدويًا</div>
</div>

<script>
/* ---------------- Croco SVG ---------------- */
function crocoSVG(mood){
  // mood: 'idle' | 'open-left' | 'open-right' | 'happy'
  return `
  <svg class="croco ${mood==='open-left'?'open-left':mood==='open-right'?'open-right':''}" viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="110" cy="112" rx="95" ry="14" fill="#00000014"/>
    <path d="M20 80 Q10 60 30 55 Q40 30 90 32 Q95 20 110 22 Q108 32 118 35 Q170 40 185 75 Q190 90 170 96 Q140 108 90 106 Q40 106 20 80 Z" fill="#2EC4B6"/>
    <path class="mouth" d="M118 35 Q170 40 185 75 Q190 90 170 96 Q150 100 130 92 Q125 60 118 35 Z" fill="#1B9C90"/>
    <ellipse cx="150" cy="70" rx="14" ry="7" fill="#FF9AA2" opacity="${mood==='open-left'||mood==='open-right'?1:0}"/>
    <circle cx="95" cy="30" r="7" fill="#fff"/><circle cx="97" cy="28" r="3.4" fill="#2B2140"/>
    <circle cx="118" cy="26" r="7" fill="#fff"/><circle cx="120" cy="24" r="3.4" fill="#2B2140"/>
    <path d="M40 88 Q60 100 90 98" stroke="#1B9C90" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="55" cy="70" r="4" fill="#1B9C9088"/><circle cx="70" cy="60" r="3" fill="#1B9C9088"/>
  </svg>`;
}

/* ---------------- Scene data ---------------- */
const STAR = "⭐";
function dotsHTML(count, emoji){
  if(count===0) return `<span class="empty-note">لا يوجد شيء 😅</span>`;
  let html="";
  for(let i=0;i<count;i++){ html += `<span style="animation-delay:${i*0.05}s">${emoji}</span>`; }
  return html;
}

const compareRounds = [
  {a:3, b:8, emoji:"🍎", noun:"تفاحة"},
  {a:9, b:2, emoji:"🍌", noun:"موزة"},
  {a:5, b:5, emoji:"⭐", noun:"نجمة"},
  {a:0, b:4, emoji:"🎈", noun:"بالونة"},
  {a:10,b:6, emoji:"🐸", noun:"ضفدعة"},
  {a:1, b:7, emoji:"🍬", noun:"حلوى"},
];

function buildCompareScene(round, idx){
  const {a,b,emoji} = round;
  let symbol, mood, resultText;
  if(a>b){ symbol="أكبر من >"; mood="open-left"; resultText=`${a} أكبر من ${b}`; }
  else if(b>a){ symbol="أصغر من <"; mood="open-right"; resultText=`${a} أصغر من ${b}`; }
  else { symbol="يساوي ="; mood="idle"; resultText=`${a} يساوي ${b}`; }

  const leftWin = a>b, rightWin = b>a;

  return {
    id:`cmp${idx}`,
    narration: `${crocoOpener(a,b)} ... ${resultText}`,
    html:`
      <div class="caption">من أكبر؟ ${a} ولا ${b}؟</div>
      ${crocoSVG(mood)}
      <div class="compare-wrap">
        <div class="pile ${leftWin?'winner':''}">
          <div class="items">${dotsHTML(a, round.emoji)}</div>
          <div class="count-label">${a}</div>
        </div>
        <div class="symbol-badge">${symbol.split(' ')[1]||''}</div>
        <div class="pile ${rightWin?'winner':''}">
          <div class="items">${dotsHTML(b, round.emoji)}</div>
          <div class="count-label">${b}</div>
        </div>
      </div>
      <div class="subcaption">${resultText} 🎉</div>
    `
  };
}
function crocoOpener(a,b){
  if(a===b) return `كروكو محتار! ${a} و ${b} متساويين تمامًا`;
  return `كروكو الجعان بياكل دايمًا العدد الأكبر`;
}

const scenes = [
  { id:"intro",
    narration:"أهلاً بيكي! أنا كروكو، وهعلمك اليوم مين الأكبر ومين الأصغر من صفر لعشرة. جاهزة؟",
    html:`
      ${crocoSVG('idle')}
      <div class="caption">أهلاً! أنا كروكو 🐊<br>هنتعلم مع بعض الأرقام من ٠ لـ ١٠!</div>
    `
  },
  { id:"counting",
    narration:"يلا نعد سوا من صفر لعشرة",
    html:`<div id="countingHost"></div>`,
    isCounting:true
  },
  { id:"rule",
    narration:"كروكو قاعدة سهلة: فمي الكبير بياكل دايمًا العدد الأكبر! العدد الصغير بيفضل لوحده.",
    html:`
      ${crocoSVG('open-right')}
      <div class="caption">قاعدة كروكو 🐊<br>فمي بيبقى مفتوح ناحية <b>العدد الأكبر</b> دايمًا!</div>
    `
  },
  ...compareRounds.map(buildCompareScene),
  { id:"recap",
    narration:"يلا نتذكر: علامة أكبر من، وعلامة أصغر من، وعلامة يساوي",
    html:`
      <div class="caption">يلا نفتكر مع بعض 🐊</div>
      <div class="recap-row">
        <div class="recap-item"><div class="sym">&gt;</div><div class="lbl">أكبر من</div></div>
        <div class="recap-item"><div class="sym">&lt;</div><div class="lbl">أصغر من</div></div>
        <div class="recap-item"><div class="sym">=</div><div class="lbl">يساوي</div></div>
      </div>
    `
  },
  { id:"end",
    narration:"برافو عليكي! بقيتي بطلة الأرقام! أنا فخور بيكي جدًا",
    html:`
      ${crocoSVG('idle')}
      <div class="caption">🎉 برافو! أنتي بطلة الأرقام 🎉</div>
      <div class="stars-row"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    `,
    confetti:true
  }
];

/* ---------------- Player engine ---------------- */
const stage = document.getElementById('stage');
const progressTrack = document.getElementById('progressTrack');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const muteBtn = document.getElementById('muteBtn');

let current = 0;
let playing = false;
let muted = false;
let advanceTimer = null;
let segFillTimer = null;

// build scene DOM + progress segments
scenes.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'scene';
  el.id = 'scene-' + i;
  el.innerHTML = s.html;
  stage.appendChild(el);

  const seg = document.createElement('div');
  seg.className = 'progress-seg';
  seg.id = 'seg-' + i;
  seg.innerHTML = '<div class="fill"></div>';
  seg.onclick = () => { stopAdvanceTimer(); goTo(i); if(playing) scheduleAdvance(); };
  progressTrack.appendChild(seg);
});

function goTo(i){
  if(i<0) i=0;
  if(i>=scenes.length){ i=scenes.length-1; pause(); }
  document.querySelectorAll('.scene').forEach(el=>el.classList.remove('active'));
  document.getElementById('scene-'+i).classList.add('active');
  current = i;
  updateProgressUI();
  prevBtn.disabled = (current===0);

  if(scenes[i].isCounting) runCountingScene();
  if(scenes[i].confetti) spawnConfetti();

  speak(scenes[i].narration);
}

function updateProgressUI(){
  document.querySelectorAll('.progress-seg').forEach((seg, idx)=>{
    seg.classList.toggle('done', idx < current);
    const fill = seg.querySelector('.fill');
    if(idx < current) fill.style.width='100%';
    else if(idx > current) fill.style.width='0%';
  });
}

function stopAdvanceTimer(){
  clearTimeout(advanceTimer);
  clearInterval(segFillTimer);
  const fill = document.querySelector('#seg-'+current+' .fill');
  if(fill) fill.style.width = (fill.style.width==='100%') ? '100%' : fill.style.width;
}

function scheduleAdvance(){
  stopAdvanceTimer();
  const duration = 4200; // ms per scene while autoplay
  const fill = document.querySelector('#seg-'+current+' .fill');
  let start = null;
  if(fill){
    fill.style.transition='none';
    fill.style.width='0%';
    requestAnimationFrame(()=>{ fill.style.transition = `width ${duration}ms linear`; fill.style.width='100%'; });
  }
  advanceTimer = setTimeout(()=>{
    if(current < scenes.length-1){ goTo(current+1); if(playing) scheduleAdvance(); }
    else { pause(); }
  }, duration);
}

function play(){
  playing = true;
  playBtn.textContent = '⏸';
  scheduleAdvance();
}
function pause(){
  playing = false;
  playBtn.textContent = '▶';
  stopAdvanceTimer();
  window.speechSynthesis && window.speechSynthesis.cancel();
}

playBtn.onclick = ()=> playing ? pause() : play();
prevBtn.onclick = ()=>{ pause(); goTo(current-1); };
nextBtn.onclick = ()=>{ pause(); goTo(current+1); };
muteBtn.onclick = ()=>{
  muted = !muted;
  muteBtn.textContent = muted ? '🔇' : '🔊';
  if(muted) window.speechSynthesis && window.speechSynthesis.cancel();
};

function speak(text){
  if(muted || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ar-SA';
  u.rate = 0.92;
  u.pitch = 1.05;
  window.speechSynthesis.speak(u);
}

/* counting intro scene: cycles 0..10 */
function runCountingScene(){
  const host = document.getElementById('countingHost');
  if(!host) return;
  let n = 0;
  host.innerHTML = `<div class="caption">يلا نعد مع بعض! 🔢</div>
    <div class="big-number" id="cnBig">0</div>
    <div class="dots-row" id="cnDots"></div>`;
  const bigEl = document.getElementById('cnBig');
  const dotsEl = document.getElementById('cnDots');
  function render(){
    bigEl.textContent = n;
    bigEl.style.animation='none'; void bigEl.offsetWidth; bigEl.style.animation='pop .4s cubic-bezier(.34,1.56,.64,1)';
    dotsEl.innerHTML = dotsHTML(n, '⭐');
  }
  render();
  clearInterval(window.__countInt);
  window.__countInt = setInterval(()=>{
    n++;
    if(n>10){ clearInterval(window.__countInt); return; }
    render();
  }, 550);
}

function spawnConfetti(){
  const stageEl = stage;
  const emojis = ['🎉','⭐','🎈','🍎','🌟'];
  for(let i=0;i<18;i++){
    const c = document.createElement('div');
    c.className='confetti';
    c.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    c.style.left = Math.random()*100+'%';
    c.style.animationDuration = (1.6+Math.random()*1.4)+'s';
    c.style.animationDelay = (Math.random()*0.6)+'s';
    stageEl.appendChild(c);
    setTimeout(()=>c.remove(), 3200);
  }
}

/* init */
goTo(0);
</script>
</body>
</html>
