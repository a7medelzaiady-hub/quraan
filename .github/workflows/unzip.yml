name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o quraan-offline.zip
          cp -r quraan-offline/. .
          rm -rf quraan-offline quraan-offline.zip
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "add offline version" || exit 0
          git push
