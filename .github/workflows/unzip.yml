name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n1)
          if [ -z "$ZIP" ]; then echo "لا يوجد ملف zip في المستودع"; exit 1; fi
          mkdir /tmp/x
          unzip -o "$ZIP" -d /tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" -eq 1 ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then
            SRC="/tmp/x/$(ls /tmp/x)"
          else
            SRC=/tmp/x
          fi
          rsync -a --exclude='.github' "$SRC"/ ./
          rm -f "$ZIP"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "add offline version" || exit 0
          git push
