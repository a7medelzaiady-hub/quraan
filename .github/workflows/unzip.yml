name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          for f in quraan quraan.txt quraan.zip; do
            if [ -f "$f" ]; then mv "$f" offline.zip; break; fi
          done
          unzip -o offline.zip
          cp -r quraan-offline/. .
          rm -rf quraan-offline offline.zip
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "add offline version" || exit 0
          git push
