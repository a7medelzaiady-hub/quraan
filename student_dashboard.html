<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لوحة متابعة البطل - مركز خادم القرآن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --green-deep:#04201a;
  --green-mid:#0b3d2e;
  --green-light:#14795c;
  --gold:#d4af37;
  --gold-light:#fef08a;
  --cream:#fdfbf5;
  --line:#e5e7eb;
  --sub:#64748b;
  --red:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  direction:rtl;font-family:'Cairo',sans-serif;background:var(--cream);
  color:#111827;min-height:100vh;padding-bottom:50px;
}
.hdr{
  background:linear-gradient(160deg,var(--green-deep),var(--green-mid));
  padding:24px 15px;text-align:center;color:#fff;
  border-bottom:4px solid var(--gold);
  box-shadow:0 4px 15px rgba(0,0,0,.15)
}
.hdr-emblem{
  width:58px;height:58px;margin:0 auto 8px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(212,175,55,.14);border:2px solid var(--gold);
  color:var(--gold-light);font-size:26px
}
.hdr h1{font-size:22px;font-weight:900;color:var(--gold-light);margin-bottom:4px}
.hdr-subtitle{font-size:12px;color:rgba(255,255,255,.82);font-weight:700}

.container{max-width:800px;margin:18px auto;padding:0 14px}

.sec-card{
  background:#fff;border-radius:20px;border:1px solid var(--line);
  box-shadow:0 5px 18px rgba(0,0,0,.04);margin-bottom:18px;overflow:hidden
}
.sec-header{
  background:linear-gradient(135deg,var(--green-mid),var(--green-deep));
  color:var(--gold-light);padding:14px 18px;font-size:15px;font-weight:900;
  display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--gold)
}

/* معرض صور التقارير */
.reports-gallery{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:14px;padding:16px
}
.report-img-card{
  background:#f8faf8;border:1.5px solid var(--line);border-radius:14px;
  overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.04);
  transition:.25s;display:flex;flex-direction:column;align-items:center;
  cursor:pointer
}
.report-img-card:hover{
  transform:translateY(-3px);border-color:var(--gold);
  box-shadow:0 8px 20px rgba(0,0,0,.1)
}
.report-img-preview{
  width:100%;height:280px;object-fit:cover;object-position:top;
  border-bottom:1px solid var(--line)
}
.report-img-info{
  padding:10px 12px;width:100%;text-align:center;
  background:#fff
}
.report-date-txt{
  font-size:11px;font-weight:800;color:var(--green-mid);margin-bottom:4px
}
.report-badge-rating{
  display:inline-block;font-size:10px;font-weight:800;padding:3px 10px;
  border-radius:12px;background:#fdf8e6;color:#725304;border:1px solid var(--gold)
}

/* نافذة عرض الصورة المكبرة */
.lightbox-modal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);
  z-index:99999;align-items:center;justify-content:center;
  flex-direction:column;padding:14px;backdrop-filter:blur(4px)
}
.lightbox-modal.active{display:flex}
.lightbox-img{
  max-width:96%;max-height:78vh;border-radius:14px;
  box-shadow:0 10px 35px rgba(0,0,0,.5);margin-bottom:14px;
  border:2px solid var(--gold)
}
.lightbox-actions{
  display:flex;gap:10px;justify-content:center;width:100%;flex-wrap:wrap
}
.lightbox-btn{
  padding:10px 22px;border-radius:12px;font-size:13px;font-weight:900;
  cursor:pointer;font-family:'Cairo',sans-serif;border:none;
  display:flex;align-items:center;gap:6px
}
.btn-close{background:#e5e7eb;color:#111827}
.btn-download{background:var(--green-mid);color:var(--gold-light);border:1px solid var(--gold)}

.loading-box{
  text-align:center;padding:40px;color:var(--sub);font-weight:800;font-size:14px
}
.empty-box{
  text-align:center;padding:35px;color:var(--sub);font-weight:800;font-size:13px
}
</style>
</head>

<body>
<header class="hdr">
  <div class="hdr-emblem">🕌</div>
  <h1 id="student-title-name">لوحة متابعة البطل</h1>
  <div class="hdr-subtitle">مركز خادم القرآن الكريم — تحت إشراف الشيخ عبدالرحمن</div>
</header>

<div class="container">
  <!-- قسم معرض جميع صور التقارير -->
  <div class="sec-card">
    <div class="sec-header">
      <i class="ti ti-photo"></i>
      <span>جميع صور تقارير المتابعة والمعاينات 📜</span>
    </div>
    <div id="reports-gallery-container" class="reports-gallery">
      <div class="loading-box">جاري تجهيز وتوليد صور التقارير... ⏳</div>
    </div>
  </div>
</div>

<!-- نافذة تكبير وتنزيل الصور -->
<div class="lightbox-modal" id="lightbox-modal">
  <img src="" alt="تقرير المتابعة" class="lightbox-img" id="lightbox-img">
  <div class="lightbox-actions">
    <button class="lightbox-btn btn-close" onclick="closeLightbox()">إغلاق ✕</button>
    <a href="" download="" id="lightbox-download-link" class="lightbox-btn btn-download">
      <i class="ti ti-download"></i> تنزيل صورة التقرير
    </a>
  </div>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyAS0NNcZy0t-LN2wCB7p0941jR0bo-MNls",
  authDomain:"ahmedelzaiady.firebaseapp.com",
  projectId:"ahmedelzaiady",
  storageBucket:"ahmedelzaiady.firebasestorage.app",
  messagingSenderId:"300306825071",
  appId:"1:300306825071:web:0426ddde56280fa090329a",
  measurementId:"G-WE04GK5XZZ"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

// ثوابت ومحرك الرسم للتقارير
var C_W = 1080; var PAD = 44; var CARD_PAD_X = 38; var CARD_PAD_Y = 30;
var PALETTE = { deep:'#04201a', mid:'#0b3d2e', light:'#14795c', gold:'#d4af37', goldLt:'#fef08a', goldDk:'#8a6d0a', cream:'#fdfbf5' };
var SECTIONS = [
  {key:'ns', title:'السور الجديدة', icon:'📖', isQ:false},
  {key:'ps', title:'ماضي السور', icon:'📚', isQ:false},
  {key:'mq', title:'المذكرة الجديدة', icon:'📝', isQ:true},
  {key:'pm', title:'ماضي المذكرة', icon:'📋', isQ:true},
  {key:'sj', title:'السراج', icon:'💡', isQ:false},
  {key:'hd', title:' الأذكار', icon:'📿', isQ:true}
];

function convertToHijri(dateInput){
  try{
    let d = (dateInput && typeof dateInput === "object" && typeof dateInput.toDate === "function") ? dateInput.toDate() : new Date(dateInput || Date.now());
    if(isNaN(d.getTime())) d = new Date();
    return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-uma", { day:"numeric", month:"long", year:"numeric" }).format(d);
  }catch(e){ return "التاريخ غير متاح"; }
}

function rr(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r); ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x+r,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function wrapText(ctx, text, maxWidth){
  var words = String(text).split(' '); var lines = []; var cur = '';
  words.forEach(function(w){
    var test = cur ? cur + ' ' + w : w;
    if(ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; } else { cur = test; }
  });
  if(cur) lines.push(cur); return lines.length ? lines : [''];
}

function drawRoyalPill(ctx, text, anchorX, y, opts){
  opts = opts || {}; ctx.save(); ctx.font = opts.font || '800 24px Cairo, sans-serif';
  var padX = opts.padX != null ? opts.padX : 28; var h = opts.h || 48;
  var w = ctx.measureText(text).width + padX * 2.5;
  var left = opts.align === 'left' ? anchorX : (opts.align === 'center' ? anchorX - w/2 : anchorX - w);
  if(opts.draw !== false){
    ctx.beginPath(); ctx.moveTo(left + 15, y); ctx.lineTo(left + w - 15, y);
    ctx.quadraticCurveTo(left + w, y, left + w, y + h/2); ctx.quadraticCurveTo(left + w, y + h, left + w - 15, y + h);
    ctx.lineTo(left + 15, y + h); ctx.quadraticCurveTo(left, y + h, left, y + h/2); ctx.quadraticCurveTo(left, y, left + 15, y); ctx.closePath();
    ctx.fillStyle = opts.bg || '#ffffff'; ctx.fill();
    if(opts.border){ ctx.lineWidth = opts.borderWidth || 2; ctx.strokeStyle = opts.border; ctx.stroke(); }
    ctx.fillStyle = opts.color || '#111827'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, left + w/2, y + h/2 + 2);
  }
  ctx.restore(); return w;
}

function ratingStyle(rating){
  if(!rating) return {bg:'#f0fdf4', color:'#166534', border:'#22c55e'};
  if(rating.indexOf('بارك الله فيك')>-1 || rating.indexOf('👑')>-1) return {bg:'#fdf8e6', color:'#725304', border:'#d4af37'};
  if(rating.indexOf('جيد جدا')>-1) return {bg:'#fefce8', color:'#854d0e', border:'#eab308'};
  if(rating.indexOf('جيد')>-1) return {bg:'#f0fdf4', color:'#166534', border:'#22c55e'};
  return {bg:'#fef2f2', color:'#991b1b', border:'#ef4444'};
}

function renderItemCard(ctx, item, sec, x, y, width, draw){
  var innerW = width - CARD_PAD_X*2; var rightX = x + width - CARD_PAD_X; var leftX = x + CARD_PAD_X; var cy = y + CARD_PAD_Y;
  var mainTxt, subTxt = null;
  if(item.sr){ mainTxt = item.sr; subTxt = item.type === 'range' ? ('الآيات ' + item.f + ' - ' + item.t) : 'السورة كاملةً'; }
  else { var u = (sec.key === 'hd') ? 'رقم' : 'سؤال'; mainTxt = 'من ' + u + ' ' + item.f + ' إلى ' + item.t; }
  
  ctx.font = '900 38px Cairo, sans-serif'; 
  var titleLines = wrapText(ctx, mainTxt, innerW - 100);
  var titleBlockH = titleLines.length * 48;

  if(draw){
    titleLines.forEach(function(line, i){
      ctx.font = '900 38px Cairo, sans-serif'; ctx.fillStyle = PALETTE.deep; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(line, rightX, cy + 32 + i*48);
    });
  }
  if(subTxt){
    var tagY = cy + Math.max(0, titleBlockH/2 - 25);
    drawRoyalPill(ctx, subTxt, leftX, tagY, {font:'700 24px Cairo, sans-serif', bg:'#fdf6e0', color:PALETTE.goldDk, border:PALETTE.gold, borderWidth:1.5, h:48, padX:18, align:'left', draw:draw});
  }
  cy += titleBlockH + 20;

  var hasRating = !!item.rating; var hasErrors = item.errors !== '' && item.errors != null;
  if(hasRating || hasErrors){
    var errTxt = (item.errors === '0' || !item.errors) ? 'بلا أخطاء ✨' : ('الأخطاء: ' + item.errors);
    var errPillH = 54;
    if(hasRating){
      var rs = ratingStyle(item.rating);
      drawRoyalPill(ctx, item.rating, rightX, cy, {font:'800 26px Cairo, sans-serif', bg:rs.bg, color:rs.color, border:rs.border, borderWidth:2, h:errPillH, padX:22, align:'right', draw:draw});
    }
    if(hasErrors){
      var isZero = (item.errors === '0' || !item.errors);
      var es = isZero ? {bg:'#e7f5ee', color:PALETTE.mid, border:PALETTE.mid} : {bg:'#fdecec', color:'#9a1d1d', border:'#e0554f'};
      drawRoyalPill(ctx, errTxt, leftX, cy, {font:'800 22px Cairo, sans-serif', bg:es.bg, color:es.color, border:es.border, borderWidth:2, h:errPillH, padX:22, align:'left', draw:draw});
    }
    cy += errPillH + 20;
  }
  return cy - y;
}

function renderNextPlanCard(ctx, item, sec, x, y, width, draw){
  var innerW = width - CARD_PAD_X*2; var rightX = x + width - CARD_PAD_X; var cy = y + CARD_PAD_Y;
  var planTxt = item.nextPlanSr ? (item.nextPlanSr + (item.nextPlanType === 'range' ? (' (الآيات ' + item.nextPlanF + ' - ' + item.nextPlanT + ')') : ' كاملةً')) : ('من سؤال ' + item.nextPlanF + ' إلى ' + item.nextPlanT);
  ctx.font = '700 28px Cairo, sans-serif'; var planLines = wrapText(ctx, planTxt, innerW - 48);
  var boxH = 22 + 38 + planLines.length*40 + 22;
  var boxX = x + CARD_PAD_X - 14; var boxW = width - (CARD_PAD_X - 14)*2;
  if(draw){
    rr(ctx, boxX, cy - 10, boxW, boxH, 16); ctx.fillStyle = '#fbf3d9'; ctx.fill();
    ctx.font = '800 26px Cairo, sans-serif'; ctx.fillStyle = PALETTE.goldDk; ctx.textAlign = 'right';
    ctx.fillText('🎯 الخطة القادمة', rightX - 20, cy + 28);
    planLines.forEach(function(line, i){
      ctx.font = '700 28px Cairo, sans-serif'; ctx.fillStyle = '#5a4400';
      ctx.fillText(line, rightX - 20, cy + 28 + 38 + 20 + i*40);
    });
  }
  return boxH + CARD_PAD_Y*2 - 10;
}

function layoutReport(ctx, canvasH, nm, data, reportDate, draw){
  var y = 0;
  if(draw){ ctx.fillStyle = PALETTE.cream; ctx.fillRect(0, 0, C_W, canvasH); }
  var hH = 232;
  if(draw){
    var hG = ctx.createLinearGradient(0, 0, 0, hH); hG.addColorStop(0, PALETTE.deep); hG.addColorStop(1, PALETTE.mid);
    ctx.fillRect(0, 0, C_W, hH);
    ctx.font = '900 52px Amiri, serif'; ctx.fillStyle = PALETTE.goldLt; ctx.textAlign = 'center'; ctx.fillText('مركز خادم القرآن الكريم', C_W/2, 100);
  }
  y = hH;
  var bh = 90; var bw = C_W - PAD*2; var bx = PAD;
  if(draw){
    rr(ctx, bx, y, bw, bh, 30); ctx.fillStyle = PALETTE.gold; ctx.fill();
    ctx.font = '900 40px Cairo, sans-serif'; ctx.fillStyle = PALETTE.deep; ctx.textAlign = 'center'; ctx.fillText('بطلنا: ' + nm + ' 🏆', C_W/2, y + 56);
  }
  y += bh + 40;

  var cardX = PAD; var cardW = C_W - PAD*2;
  SECTIONS.forEach(function(sec){
    var sData = data[sec.key]; if(!sData || (!sData.currents.length && !sData.nexts.length)) return;
    if(draw){
      ctx.font = '900 36px Cairo, sans-serif'; ctx.fillStyle = PALETTE.mid; ctx.textAlign = 'right'; ctx.fillText(sec.icon + ' ' + sec.title, cardX + cardW, y + 30);
    }
    y += 50;
    sData.currents.forEach(function(item){
      var h = renderItemCard(ctx, item, sec, cardX, y, cardW, false);
      if(draw){
        rr(ctx, cardX, y, cardW, h, 18); ctx.fillStyle = '#ffffff'; ctx.fill();
        renderItemCard(ctx, item, sec, cardX, y, cardW, true);
      }
      y += h + 16;
    });
    sData.nexts.forEach(function(plan){
      var h = renderNextPlanCard(ctx, plan, sec, cardX, y, cardW, false);
      if(draw){
        rr(ctx, cardX, y, cardW, h, 18); ctx.fillStyle = '#ffffff'; ctx.fill();
        renderNextPlanCard(ctx, plan, sec, cardX, y, cardW, true);
      }
      y += h + 16;
    });
  });
  return y + 60;
}

async function drawReportCanvas(studentName, academicData, reportDate){
  var tmp = document.createElement('canvas'); tmp.width = C_W; tmp.height = 10;
  var totalH = layoutReport(tmp.getContext('2d'), 0, studentName, academicData, reportDate, false);
  var canvas = document.createElement('canvas'); canvas.width = C_W; canvas.height = Math.max(totalH, 600);
  layoutReport(canvas.getContext('2d'), canvas.height, studentName, academicData, reportDate, true);
  return canvas.toDataURL('image/jpeg', 0.88);
}

// جلب وتوليد صور جميع تقارير الطالب
async function loadStudentReportsGallery(){
  const urlParams = new URLSearchParams(window.location.search);
  const studentId = urlParams.get('id');

  if(!studentId){
    document.getElementById("reports-gallery-container").innerHTML = '<div class="empty-box">❌ لم يتم تحديد الطالب.</div>';
    return;
  }

  try{
    const docSnap = await db.collection("students").doc(studentId).get();
    if(!docSnap.exists()){
      document.getElementById("reports-gallery-container").innerHTML = '<div class="empty-box">❌ بيانات الطالب غير موجودة.</div>';
      return;
    }

    const sData = docSnap.data();
    const studentName = sData.name || "البطل";
    document.getElementById("student-title-name").innerText = "لوحة متابعة البطل (" + studentName + ")";

    const txs = sData.transactions || [];
    if(txs.length === 0){
      document.getElementById("reports-gallery-container").innerHTML = '<div class="empty-box">لا توجد تقارير مسجلة لهذا الطالب حتى الآن.</div>';
      return;
    }

    // ترتيب التقارير من الأحدث للأقدم
    txs.sort((a,b) => new Date(b.date) - new Date(a.date));

    const container = document.getElementById("reports-gallery-container");
    container.innerHTML = "";

    for(let i = 0; i < txs.length; i++){
      const tx = txs[i];
      const hijriDate = convertToHijri(tx.date);
      const rating = tx.generalRating || "مستوى مميز";

      // رسم وتوليد صورة التقرير
      const dataUrl = await drawReportCanvas(studentName, tx.academicData || {}, tx.date);

      const card = document.createElement("div");
      card.className = "report-img-card";
      card.onclick = () => openLightbox(dataUrl, `تقرير_${studentName}_${i+1}.jpg`);

      card.innerHTML = `
        <img src="${dataUrl}" alt="تقرير ${hijriDate}" class="report-img-preview" loading="lazy">
        <div class="report-img-info">
          <div class="report-date-txt">📅 ${hijriDate}</div>
          <span class="report-badge-rating">${rating}</span>
        </div>
      `;
      container.appendChild(card);
    }

  }catch(e){
    console.error(e);
    document.getElementById("reports-gallery-container").innerHTML = '<div class="empty-box">❌ حدث خطأ أثناء تحميل الصور.</div>';
  }
}

function openLightbox(imgSrc, downloadName){
  document.getElementById("lightbox-img").src = imgSrc;
  const dl = document.getElementById("lightbox-download-link");
  dl.href = imgSrc;
  dl.download = downloadName;
  document.getElementById("lightbox-modal").classList.add("active");
}

function closeLightbox(){
  document.getElementById("lightbox-modal").classList.remove("active");
}

document.addEventListener("DOMContentLoaded", loadStudentReportsGallery);
</script>
</body>
</html>
